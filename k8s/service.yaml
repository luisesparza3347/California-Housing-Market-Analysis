apiVersion: v1
kind: Service
metadata:
  name: housing-api
spec:
  type: NodePort
  selector:
    app: housing-api
  ports:
    - port: 8000
      targetPort: 8000
      # Matches kind-config.yaml's extraPortMappings: containerPort 30080 ->
      # host port 8080. Fixed here rather than left to a random NodePort so
      # the two files don't drift out of sync.
      nodePort: 30080
